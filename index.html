<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pong Game</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>PONG GAME</h1>
        
        <div class="scoreboard">
            <div class="score-section">
                <h2>Player</h2>
                <div id="playerScore" class="score">0</div>
            </div>
            <div class="divider">VS</div>
            <div class="score-section">
                <h2>Computer</h2>
                <div id="computerScore" class="score">0</div>
            </div>
        </div>

        <canvas id="gameCanvas" width="800" height="400"></canvas>

        <div class="instructions">
            <h3>Controls</h3>
            <p><strong>Player (Green Paddle):</strong></p>
            <ul>
                <li>🖱️ Move Mouse Up/Down</li>
                <li>⬆️ Arrow Keys or W/S</li>
            </ul>
            <p><strong>Computer (Red Paddle):</strong> AI Controlled</p>
            <p><strong>Goal:</strong> First to 5 points wins!</p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
